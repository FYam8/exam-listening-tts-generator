name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m py_compile generate.py scripts/publication_audit.py
      - name: Test
        run: python -m pytest
      - name: Validate public contents
        run: python scripts/publication_audit.py .
      - name: Validate sample without network
        run: python generate.py generate --dry-run --input examples/sample_script.json --output output/sample.mp3

