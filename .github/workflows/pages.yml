name: Deploy audited listening v18

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reconstruct audited v15 base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/listening-release
          mkdir -p /tmp/listening-release
          {
            cat .v10_chunks/part00.b64
            cat .v10_repair/part01a.b64 .v10_repair/part01b.b64
            cat .v10_chunks/part02.b64 .v10_chunks/part03.b64
            cat .v10_repair/part04a.b64 .v10_repair/part04b0.b64 .v10_repair/part04b1.b64
            cat .v10_chunks/part05.b64 .v10_chunks/part06.b64 .v10_chunks/part07.b64 .v10_chunks/part08.b64 .v10_chunks/part09.b64 .v10_chunks/part10.b64 .v10_chunks/part11.b64
            cat .v10_repair/part12a0.b64 .v10_repair/part12a1.b64 .v10_repair/part12b0.b64 .v10_repair/part12b1.b64 .v10_repair/part13.b64
          } | base64 --decode > /tmp/v10.zip
          echo 'f5dd47cfa72218bf6d9a65fbdc60641266c2c5abab45b7146950681ccb269a8a  /tmp/v10.zip' | sha256sum -c -
          unzip -q /tmp/v10.zip -d /tmp/listening-release

          cat .v12_delta/p*.b64 | base64 --decode > /tmp/v12.patch.xz
          echo 'ded577988f7f65a80923bb5fe30bc2bf753c42482cb29f44ebf84a4ded56e127  /tmp/v12.patch.xz' | sha256sum -c -
          xz -dc /tmp/v12.patch.xz > /tmp/v12.patch
          (cd /tmp/listening-release && patch -p1 < /tmp/v12.patch)

          cat .v12_2_delta/p*.b64 | base64 --decode > /tmp/v12_2_delta.tar.gz
          echo 'd18ef5e3a094f35c5e56ffc88c6a48d0a8ffc052863a90dab5ad8e03612ac00a  /tmp/v12_2_delta.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v12_2_delta.tar.gz -C /tmp/listening-release
          mkdir -p /tmp/listening-release/.github/workflows
          cp .v12_2_release/pages.yml /tmp/listening-release/.github/workflows/pages.yml

          {
            cat .v14_delta4k/p00.b64 .v14_delta4k/p01.b64 .v14_delta4k/p02.b64
            cat .v14_delta/p012.b64 .v14_delta/p013.b64 .v14_delta/p014.b64 .v14_delta/p015.b64 .v14_delta/p016.b64 .v14_delta/p017.b64
            cat .v14_delta/p018.b64 .v14_delta/p019.b64 .v14_delta/p020.b64 .v14_delta/p021.b64 .v14_delta/p022.b64 .v14_delta/p023.b64
            cat .v14_delta/p024.b64 .v14_delta/p025.b64 .v14_delta/p026.b64 .v14_delta/p027.b64 .v14_delta/p028.b64 .v14_delta/p029.b64
            cat .v14_delta/p030.b64 .v14_delta/p031.b64 .v14_delta/p032.b64 .v14_delta/p033.b64 .v14_delta/p034.b64
          } | base64 --decode > /tmp/v14.patch.xz
          echo 'f76cd767c446f9d6be1883ddda4a8a1d5e3da0cd341573e3d9f0a93f718b2e90  /tmp/v14.patch.xz' | sha256sum -c -
          xz -dc /tmp/v14.patch.xz > /tmp/v14.patch
          (cd /tmp/listening-release && patch -p1 < /tmp/v14.patch)

          cat .v15_delta/p*.b64 | base64 --decode > /tmp/v15.patch.xz
          echo 'be6334c91a901a31bef92f1bb31456b3d13495ecb54c71bcf13a0915a719518c  /tmp/v15.patch.xz' | sha256sum -c -
          xz -dc /tmp/v15.patch.xz > /tmp/v15.patch
          (cd /tmp/listening-release && patch -p1 < /tmp/v15.patch)

      - name: Apply verified v17 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .v17_delta/p*.b64 | base64 --decode > /tmp/v17.patch.xz
          echo '14b866b54fe8438462fbc9b7177d97594cdb736b7b11c64ac10c85355b984621  /tmp/v17.patch.xz' | sha256sum -c -
          xz -dc /tmp/v17.patch.xz > /tmp/v17.patch
          (cd /tmp/listening-release && patch -p1 < /tmp/v17.patch)

      - name: Apply verified v18 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .v18_delta4k/p*.b64 | base64 --decode > /tmp/v18_delta.tar.xz
          echo 'd760bbb14f3a66bd31c844ade823055abe514b1aff64a88548eb18d42a74c5fe  /tmp/v18_delta.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v18_delta.tar.xz -C /tmp/listening-release
          cd /tmp/listening-release
          echo '7f75dcd1e7a80d793dc971a9e7232b7b84b164bff4ed6a6ecda1e36ed8242003  .github/workflows/pages.yml' | sha256sum -c -
          echo '89016e6b184e50dadb0cbb1777d1f4e16c2cf8aad33808978d8d3053403955b6  CHAT_HANDOFF.md' | sha256sum -c -
          echo '0bd9462c1d6fc16358490723efd43a6c4809aa143c456ce015970941212ebdcd  GITHUB_PUBLISHING.md' | sha256sum -c -
          echo 'd95dfda40f2801d0145a92ec3638cc0f58caaaa14ea5944de4e7f4de55d8ba3d  README.md' | sha256sum -c -
          echo '86c289996d908ec051ee409fbae349c98f7dee48725021ee260826e2a70b311b  V18_FRESH_START_AUDIT.md' | sha256sum -c -
          echo '9b9bdd990c45a4e3af557cc743d9ace36daf715597d0acba435cc2d0a284de83  scripts/exam_choice_ui_test.js' | sha256sum -c -
          echo '5375c401778fa56508fddda146441c9c5d23cea1d5a5288d9ea7d36196764cd9  scripts/fresh_start_ui_test.js' | sha256sum -c -
          echo '53dfb37dfab62208cbdbf3ef4aaca80edc83934e3cef088fbecdf60cb8e521d7  scripts/release_readiness_audit.py' | sha256sum -c -
          echo 'c0c21464864200a3def28ce2cdfd7588fbec4695152a7a4d579249ad29bba365  web/app.js' | sha256sum -c -
          echo '6b68bd8b308d477511cdd169d94cc0f9432f35a8597d192ba4a5ed7c5a8aeb62  web/index.html' | sha256sum -c -
          echo '7b5269d210cb9d68e4caec6c200a3208712097d8c81d64299924ca4738800dd3  web/styles.css' | sha256sum -c -

      - name: Run release audits
        working-directory: /tmp/listening-release
        run: |
          set -euo pipefail
          python scripts/publication_audit.py
          python scripts/authorized_public_audit.py
          python scripts/release_readiness_audit.py
          python scripts/web_smoke_test.py
          node scripts/storage_roundtrip_test.js
          node scripts/study_plan_test.js
          node scripts/voice_assignment_test.js
          node scripts/bundled_pack_runtime_test.js
          node scripts/transfer_practice_test.js
          node scripts/cause_diagnostics_test.js
          node scripts/rediagnosis_ui_test.js
          node scripts/target_strategy_test.js
          node scripts/resume_checkpoint_test.js
          node scripts/today_flow_test.js
          node scripts/script_forward_test.js
          node scripts/exam_choice_ui_test.js
          node scripts/fresh_start_ui_test.js
          node --check web/config.js
          node --check web/storage.js
          node --check web/voice_profiles.js
          node --check web/study_plan.js
          node --check web/transfer_bank.js
          node --check web/target_strategy.js
          node --check web/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/listening-release/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
