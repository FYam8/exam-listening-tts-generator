name: Deploy listening v21 QA fix1 CLEAN

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch verified current Build v21 and apply QA fix1
        shell: bash
        run: |
          set -euo pipefail
          base='https://fyam8.github.io/exam-listening-tts-generator'
          out=/tmp/listening-web
          rm -rf "$out"; mkdir -p "$out"
          files='index.html styles.css config.js storage.js voice_profiles.js study_plan.js target_strategy.js transfer_bank.js original_bank.js public_demo.js content-a4eb4690bf31.js app.js robots.txt'
          for f in $files; do curl -fsSL "$base/$f?qa_fix1=${GITHUB_SHA}" -o "$out/$f"; done
          touch "$out/.nojekyll"
          cd "$out"
          echo '0fbe3370586c6d9d94fa924a228fc38cda2bf73970dbc789115e467bd0416e1e  index.html' | sha256sum -c -
          echo '8ecb8714734307fd7857e0d6fe567d43bb3e30c2729f89bd0c44b32fa99985c4  content-a4eb4690bf31.js' | sha256sum -c -
          echo '20c78a7c269bddf3e18bb70bc0a06e9e1952483a8beeb941d51bbe02973beea7  storage.js' | sha256sum -c -
          echo '6de8b48266e261757144307aaf77cf05cd68abff8469d70e883a4da1d36d9efa  target_strategy.js' | sha256sum -c -
          echo '2530ab386cd7f667699c2d3579fd6790925b95bcf81353160c302a7244d2c1b4  study_plan.js' | sha256sum -c -
          echo '19b1f8eca4499ce34b1d1327ad89ec1baa247a0ee135a9fbd6f34f425fc3aea5  original_bank.js' | sha256sum -c -
          echo '5db03e899b071c34216e5522834da64334094279883116f56a485117334266ba  transfer_bank.js' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          before=hashlib.sha256(s.encode()).hexdigest()
          allowed={'e709115b6a0e1f1240c141ba8afa9ad356ce4bfe26f166d33af65198bb099110','25bb9a97581b8bc690b9073a588e6878171bf544933a320b0d14a9f204d18526'}
          assert before in allowed, before
          stale='Build v19を確認して再読み込みしてください'
          fixed='Build v21を確認して再読み込みしてください'
          if stale in s: s=s.replace(stale,fixed)
          assert stale not in s and fixed in s
          p.write_text(s,encoding='utf-8')
          after=hashlib.sha256(p.read_bytes()).hexdigest()
          assert after=='25bb9a97581b8bc690b9073a588e6878171bf544933a320b0d14a9f204d18526',after
          PY
          node --check app.js
      - name: Browser smoke on final web bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/smoke.py <<'PY'
          from playwright.sync_api import sync_playwright
          import subprocess,time
          srv=subprocess.Popen(['python','-m','http.server','8123','--directory','/tmp/listening-web'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
            time.sleep(1)
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--no-sandbox']); page=b.new_page(); errors=[]; page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://127.0.0.1:8123',wait_until='load'); page.wait_for_timeout(200)
              assert page.locator('#buildBadge').inner_text().strip()=='Build v21 ✓'
              assert page.locator('#todayStartBtn').is_visible(); page.locator('#todayStartBtn').click(); page.wait_for_timeout(100)
              assert page.locator('#examQuestions .choice').count()>=4
              assert not errors,errors; b.close()
          finally: srv.terminate(); srv.wait()
          PY
          python /tmp/smoke.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/listening-web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
