name: Bootstrap audited UX v8 release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct audited release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/listening-release
          cat .release_chunks/part*.b64 | base64 --decode > /tmp/listening-release.zip
          unzip -q /tmp/listening-release.zip -d /tmp/listening-release
          test -f /tmp/listening-release/web/index.html
          test -f /tmp/listening-release/.github/workflows/pages.yml

      - name: Verify audited release
        working-directory: /tmp/listening-release
        run: |
          set -euo pipefail
          python scripts/publication_audit.py
          python scripts/authorized_public_audit.py
          python scripts/web_smoke_test.py
          node scripts/storage_roundtrip_test.js
          node scripts/study_plan_test.js
          node scripts/voice_assignment_test.js
          node scripts/bundled_pack_runtime_test.js
          node --check web/config.js
          node --check web/storage.js
          node --check web/voice_profiles.js
          node --check web/study_plan.js
          node --check web/app.js

      - name: Replace repository with audited source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/listening-release/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish listening UX v8 audited release"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/listening-release/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
