name: Deploy audited UX v8 release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/listening-release
          {
            cat .release_chunks/part00.b64
            cat .release_chunks/part01.b64
            cat .release_chunks/part02.b64
            cat .release_chunks/part03.b64
            cat .release_chunks/part04.b64
            cat .release_chunks/part05.b64
            cat .release_chunks/part06.b64
            cat .release_chunks/part07.b64
            cat .release_chunks/part08.b64
            cat .release_chunks/part09.b64
            cat .release_chunks/part10.b64
            cat .release_chunks/p11-*.b64
            cat .release_chunks/part12.b64
          } | base64 --decode > /tmp/listening-release.zip
          unzip -t /tmp/listening-release.zip
          unzip -q /tmp/listening-release.zip -d /tmp/listening-release
          test -f /tmp/listening-release/web/index.html

      - name: Verify audited release
        working-directory: /tmp/listening-release
        run: |
          set -euo pipefail
          python scripts/publication_audit.py
          python scripts/authorized_public_audit.py
          python scripts/web_smoke_test.py
          node scripts/storage_roundtrip_test.js
          node scripts/study_plan_test.js
          node scripts/voice_assignment_test.js
          node scripts/bundled_pack_runtime_test.js
          node --check web/config.js
          node --check web/storage.js
          node --check web/voice_profiles.js
          node --check web/study_plan.js
          node --check web/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/listening-release/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
