name: Deploy audited listening v12.1

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct trusted v10 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/listening-release
          {
            cat .v10_chunks/part00.b64
            cat .v10_repair/part01a.b64
            cat .v10_repair/part01b.b64
            cat .v10_chunks/part02.b64
            cat .v10_chunks/part03.b64
            cat .v10_repair/part04a.b64
            cat .v10_repair/part04b0.b64
            cat .v10_repair/part04b1.b64
            cat .v10_chunks/part05.b64
            cat .v10_chunks/part06.b64
            cat .v10_chunks/part07.b64
            cat .v10_chunks/part08.b64
            cat .v10_chunks/part09.b64
            cat .v10_chunks/part10.b64
            cat .v10_chunks/part11.b64
            cat .v10_repair/part12a0.b64
            cat .v10_repair/part12a1.b64
            cat .v10_repair/part12b0.b64
            cat .v10_repair/part12b1.b64
            cat .v10_repair/part13.b64
          } | base64 --decode > /tmp/v10.zip
          echo 'f5dd47cfa72218bf6d9a65fbdc60641266c2c5abab45b7146950681ccb269a8a  /tmp/v10.zip' | sha256sum -c -
          unzip -t /tmp/v10.zip
          unzip -q /tmp/v10.zip -d /tmp/listening-release

      - name: Apply verified v12.1 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .v12_delta/p*.b64 | base64 --decode > /tmp/v12.patch.xz
          echo 'ded577988f7f65a80923bb5fe30bc2bf753c42482cb29f44ebf84a4ded56e127  /tmp/v12.patch.xz' | sha256sum -c -
          xz -dc /tmp/v12.patch.xz > /tmp/v12.patch
          cd /tmp/listening-release
          patch -p1 < /tmp/v12.patch
          echo 'd1c69a227d0fa1cb92fcc0b1325be6b980da0a8fe47c3abd4338afa0228c32e0  web/app.js' | sha256sum -c -
          echo 'afc3adb13168ecaf8810c54f777f1a45d07e3aea88f152e6aca50969093ecbeb  web/index.html' | sha256sum -c -
          echo '91bcb8251c57303a9c30fa96f5e833cf2e6e0154d3af6f7ebd25091891f11bcf  web/storage.js' | sha256sum -c -
          echo 'e01e3d0606a4d0c78257c2d61035d903a111d5071b1980c5a29966368a271300  web/styles.css' | sha256sum -c -
          echo '5db03e899b071c34216e5522834da64334094279883116f56a485117334266ba  web/transfer_bank.js' | sha256sum -c -
          echo 'b0b7e4b7250c9b5bcaa61f5f45eb1fcc00826aeba5df314f05f7c29cd2067c95  scripts/transfer_practice_test.js' | sha256sum -c -
          echo 'e400020f7f9e852a41480b9a8b635971b178569f3b6c41d2a2c088b47bde4551  scripts/cause_diagnostics_test.js' | sha256sum -c -

      - name: Run release audits
        working-directory: /tmp/listening-release
        run: |
          set -euo pipefail
          python scripts/publication_audit.py
          python scripts/authorized_public_audit.py
          python scripts/web_smoke_test.py
          node scripts/storage_roundtrip_test.js
          node scripts/study_plan_test.js
          node scripts/voice_assignment_test.js
          node scripts/bundled_pack_runtime_test.js
          node scripts/transfer_practice_test.js
          node scripts/cause_diagnostics_test.js
          node --check web/config.js
          node --check web/storage.js
          node --check web/voice_profiles.js
          node --check web/study_plan.js
          node --check web/transfer_bank.js
          node --check web/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/listening-release/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
