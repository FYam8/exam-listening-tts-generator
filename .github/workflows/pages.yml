name: Deploy public listening app

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publication audit
        run: python scripts/publication_audit.py
      - name: Web smoke test
        run: python scripts/web_smoke_test.py
      - name: Storage migration/export/import tests
        run: node scripts/storage_roundtrip_test.js
      - name: Storage JavaScript syntax check
        run: node --check web/storage.js
      - name: JavaScript syntax check
        run: node --check web/app.js

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
